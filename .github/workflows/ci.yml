name: ci

# kypost-server/.github/workflows/ci.yml establishes every convention below; this file
# follows it. Push is restricted to main rather than "**": with a pull_request trigger as
# well, every push to a PR branch would otherwise run the whole suite twice for the same
# commit.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Present because this workflow could not be made to fire on its own
  # events when it first landed — push and pull_request both produced no run at all,
  # in a repository where no user-defined workflow had ever run (`.github` was
  # gitignored until the commit that added this file). A dispatchable workflow is worth
  # having regardless, and it is the one trigger that can be invoked deliberately when
  # the automatic ones are not behaving.
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run when the same ref is pushed again. main is excluded from
# cancellation: a green tick against a specific main commit is the record of whether that
# commit built, and cancelling it destroys that record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every action below is pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer: whoever controls it controls a job running in this repository. The sibling
# server repo already holds this standard and states why.

jobs:
  unit:
    name: ci-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle/wrapper/gradle-wrapper.jar is committed to this repository, so CI executes a
      # binary out of the tree it is testing. This step is the control that stops a swapped
      # jar running here: it checks the jar against the checksums Gradle publishes for every
      # release. It must come before any ./gradlew invocation.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Temurin 25 rather than the JDK 26 this was developed on: 25 is what Gradle 9.6
      # officially supports, and "works on my machine's 26" is not the same claim. If AGP
      # 9.3.1 ever refuses this JDK, raise the number here — do not lower the Gradle version.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: ./.github/actions/placeholder-google-services

      # NEVER add --write-verification-metadata to any Gradle invocation in this file.
      # gradle/verification-metadata.xml has verify-metadata=true and 600+ pinned
      # components, and the entire point is that CI FAILS on an unrecorded artifact. A job
      # that regenerates it silently defeats the supply-chain control this repo already paid
      # for: an injected dependency would be recorded as legitimate by the very run that
      # should have caught it.
      - name: unit tests and lint
        run: ./gradlew testDebugUnitTest lint

      # The other half of the rule above, expressed as a check rather than a comment: if
      # anything in this job regenerated the metadata, the file is dirty and the job fails.
      - name: dependency verification metadata is unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml

      # .gitignore is not a control, it is a default. It stops the accident it was written for and
      # nothing else: a `git add -f`, a rule someone reorders, a path that moves. These artifacts
      # are a signing identity and a signed binary, so "we listed it in .gitignore" is not the
      # standard — "the build refuses if it is tracked" is.
      #
      # Checks what git TRACKS, not what is on disk: keystore.properties legitimately exists in a
      # developer's tree (see keystore.properties.example) and is written by the release-build job
      # below. Committed is the failure.
      - name: no signing material or built artifacts are tracked
        run: |
          tracked=$(git ls-files -- \
            'keystore.properties' 'signing.properties' \
            '*.jks' '*.keystore' '*.aab' '*.apk' \
            'app/google-services.json')
          if [ -n "$tracked" ]; then
            echo "These must never be committed:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: unit test report
        if: failure()
        run: |
          find app/build/reports/tests -name '*.html' -print || true
          find app/build/test-results -name '*.xml' -exec grep -l '<failure' {} + | while read -r f; do
            echo "=== $f ==="
            cat "$f"
          done || true

  # Builds the release variant on every PR. Nothing else in CI does: `unit` builds debug and
  # `instrumented` builds debug, so until this job existed the R8 configuration in
  # app/proguard-rules.pro was shipped unverified. A missing keep rule there does not fail a
  # build — it produces an APK that installs and then throws at runtime, on the release
  # artifact only, which is the worst possible place to discover it.
  #
  # This also covers lintVitalRelease, which only runs on a release assembly.
  release-build:
    name: ci-release-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: ./.github/actions/placeholder-google-services

      # A throwaway key generated per run, NOT the release key — which must never be reachable
      # from a workflow that runs on pull_request, where an untrusted branch supplies the code.
      # The signing identity is irrelevant to what this job checks; packageRelease simply
      # refuses to run without one, by the guard in app/build.gradle.kts. The APK produced here
      # is a build artifact of the check and is never published.
      - name: throwaway signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-throwaway.jks" -alias ci \
            -keyalg RSA -keysize 4096 -validity 30 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=KyPost CI, O=Verification Only, C=US"
          printf 'storeFile=%s\nstorePassword=ci-throwaway\nkeyAlias=ci\nkeyPassword=ci-throwaway\n' \
            "$RUNNER_TEMP/ci-throwaway.jks" > keystore.properties

      - name: assemble release
        run: ./gradlew :app:assembleRelease

      # app/proguard-rules.pro told a reader to "verify with a look at mapping.txt" and nothing
      # ever did, so R8's actual output was checked by a comment. A keep rule that over-matches —
      # the blanket `Companion` rule this repo already had to remove kept most of the app — does
      # not fail a build; it silently ships an unobfuscated binary on a green run. This is that
      # instruction as a check.
      #
      # A ratio, not an absolute count, because the absolute number is meaningless without the
      # denominator and both grow as the app does. Measured at the commit that added this step:
      # 877 app classes, 195 keeping their original name (22%) — every one of them a @Serializable
      # DTO, its generated $$serializer/$Companion, or a manifest-declared component, all kept on
      # purpose. 30% is a regression tripwire with real headroom, not a target. If a legitimate
      # change pushes it over, raise it deliberately and say in the commit which rule did it.
      - name: R8 actually obfuscated the app
        run: |
          mapping=app/build/outputs/mapping/release/mapping.txt
          test -f "$mapping" || { echo "No $mapping — is minification still enabled?" >&2; exit 1; }
          total=$(grep -cE '^org\.kysecurity\.mail\.[^ ]* ->' "$mapping")
          kept=$(grep -cE '^org\.kysecurity\.mail\.[^ ]* -> org\.kysecurity\.mail\.' "$mapping")
          echo "app classes: $total, keeping their original name: $kept"
          test "$total" -gt 0
          test $((kept * 100 / total)) -lt 30

      - name: dependency verification metadata is unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml

      - name: lint vital report
        if: failure()
        run: |
          find app/build/reports -name 'lint-results*' -print -exec cat {} + || true

  instrumented:
    # A MATRIX JOB CANNOT PROVIDE THE REQUIRED CONTEXT. main's ruleset requires a check named
    # exactly "ci-instrumented", and GitHub appends the matrix values to the check name whatever
    # `name:` says — pinning it to a static string still reported "ci-instrumented (31)" and
    # "ci-instrumented (34)", so the required context never arrived and the PR sat BLOCKED on a
    # check that does not exist. These legs are named for what they are; instrumented-gate below
    # supplies the context.
    name: ci-emulator
    runs-on: ubuntu-latest
    # Slower and flakier than unit-only, and still worth it: the wipe, teardown, Keystore
    # and enrollment-state guarantees are asserted ONLY here. A CI that ran unit tests alone
    # would give this repository false confidence about precisely its most security-relevant
    # behaviour.
    #
    # A matrix, not a single version. This ran on API 34 alone while the app declares
    # minSdk 31 and targetSdk 36 — so the two API levels whose behaviour the app actually
    # commits to were the two never exercised, on a codebase whose security properties are
    # heavily API-version dependent (Keystore, backup eligibility, setHideOverlayWindows,
    # background-start restrictions).
    strategy:
      fail-fast: false
      matrix:
        # 31 is minSdk, 34 is what this job used to run alone, and 36 is targetSdk.
        #
        # 36 is ADVISORY — see `continue-on-error` below — because on the API 36 image every test
        # that calls Activity.recreate() fails with
        #   Activity never becomes requested state "[RESUMED]" (last lifecycle transition = "STOPPED")
        # — FoldLockBehaviourTest, ContactEditDraftTest, ContactsListStateRestoreTest,
        # InboxStateRestoreTest. Reproduced on unmodified main (run 32171765211), so it is not a
        # regression from any branch.
        #
        # It was previously ABSENT rather than advisory, with that paragraph as the whole record.
        # That is the wrong shape for a gap this size: the app declares targetSdk 36, so if the
        # cause is the app rather than the headless emulator then activity recreation is broken for
        # every user on Android 16 — and a comment cannot tell you whether it still is, whether the
        # failure set grew, or whether a change fixed it. Running it advisory does: every run now
        # produces the current evidence, at the cost of a leg that is allowed to be red.
        #
        # STILL OPEN: reproduce on a physical Android 16 device. If it passes there, the emulator
        # image is the cause and this leg can be promoted to required. If it fails there, this is a
        # user-facing data-loss bug in the default configuration and it outranks everything else in
        # this file. Do not promote it to required, and do not delete it, until one of those two is
        # established.
        api-level: [31, 34, 36]
    # Only 36 is allowed to fail. A leg marked continue-on-error does not contribute failure to the
    # job's result, while 31 and 34 still do — so `instrumented-gate`'s existing aggregate check
    # keeps meaning "the required legs passed" with no change needed there.
    continue-on-error: ${{ matrix.api-level == 36 }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: ./.github/actions/placeholder-google-services

      # Hardware acceleration for the emulator. Without it the AVD falls back to software
      # and a 45-minute timeout is not enough.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # target: google_apis, NOT google_apis_playstore. Play Store images are user builds,
      # where `adb shell locksettings` is not permitted — and without it the lock-screen step
      # below cannot run at all.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # THE ACTION RUNS EACH LINE BELOW AS ITS OWN `/usr/bin/sh -c` INVOCATION —
            # dash, not bash, and a separate process per line. Two rules follow, and the
            # run log of 31128861943 shows the `[command]/usr/bin/sh -c ...` lines proving it.
            #
            # 1. No construct may span lines. A multi-line `|| { ... }` brace group reaches
            #    dash as just `grep ... || {`, which is "Syntax error: end of file unexpected
            #    (expecting \"}\")". That is precisely how this workflow died on its first
            #    real execution, before a single test ran.
            # 2. NO SHELL STATE SURVIVES BETWEEN LINES. A variable assigned on one line is
            #    gone on the next, as is any `cd`. That is why the lock-screen check below
            #    goes through a file in /tmp rather than a variable — it is the only way the
            #    `verify` output reaches the `grep`.

            # The action reports the boot complete before adb is reliably answering — the first
            # run logged "Unable to connect to adb daemon" and three adb exit-code-1s during
            # startup. Wait explicitly rather than racing it.
            adb wait-for-device

            # EnrollmentVault.ensureKey() returns false on a device with no secure lock
            # screen, BY DESIGN — the envelope's protection IS the lock screen. On a bare
            # emulator that makes EnrollmentVaultTest, EnrollmentStateTest and the enrollment
            # round-trip test fail as though the code were broken. Set one first.
            adb shell locksettings set-pin 1234

            # Prove it took, rather than assuming. A silent failure here reads downstream as
            # a Keystore bug and costs an afternoon.
            adb shell locksettings verify --old 1234 | tee /tmp/lockcheck.txt
            if ! grep -qi "verified successfully" /tmp/lockcheck.txt; then echo "The emulator has no secure lock screen; the vault suites cannot pass." >&2; exit 1; fi

            # Dismiss the keyguard the PIN just armed, so the test run is not typing into it.
            adb shell input keyevent 82
            adb shell input text 1234
            adb shell input keyevent 66

            ./gradlew connectedDebugAndroidTest

      - name: dependency verification metadata is unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml

      - name: instrumented test report
        if: failure()
        run: |
          find app/build/reports/androidTests -name '*.html' -print || true
          find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l '<failure' {} + | while read -r f; do
            echo "=== $f ==="
            cat "$f"
          done || true

  # The context main's ruleset requires, supplied by a job with NO matrix so its check name is
  # exactly "ci-instrumented". `needs.<job>.result` on a matrix job is the aggregate: "success"
  # only when every leg succeeded. `if: always()` so this still runs — and fails — when a leg did
  # not, rather than being skipped and leaving the required check pending forever.
  instrumented-gate:
    name: ci-instrumented
    runs-on: ubuntu-latest
    needs: instrumented
    if: always()
    steps:
      # "Every REQUIRED leg" — API 36 is advisory and cannot fail this, by `continue-on-error` on
      # the matrix rather than by anything here. Read the 36 leg's log when it is red; it is the
      # open question recorded in that matrix comment, not noise to be silenced.
      - name: require every required emulator leg
        run: |
          echo "ci-emulator matrix result (API 36 excluded, advisory): ${{ needs.instrumented.result }}"
          test "${{ needs.instrumented.result }}" = "success"
