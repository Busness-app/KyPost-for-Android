name: Feature request
description: Suggest something the Android app should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve, and what does it cost you today?
      description: >-
        The problem, not the solution. A described problem can be solved several
        ways; a described solution can only be accepted or refused.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind, if you have something specific
